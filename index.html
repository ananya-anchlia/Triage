<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triage</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="emergency-bar">
    <span>Emergency? <a href="tel:911">Call 911</a></span>
  </div>
  <div class="demo-strip">Demo network: simulated facilities and wait times.</div>

  <main>
    <div id="map" aria-label="Map of simulated Triangle facilities"></div>

    <aside class="panel" id="panel">
      <h1>Triage</h1>

      <form id="intake-form" novalidate>
        <p class="note">Prototype safety checklist based on published ACEP guidance. Not a validated clinical tool.</p>
        <label>Injury type
          <select id="injury-type" required>
            <option value="">Choose...</option>
            <option value="sprain_or_simple_fracture">Sprain or possible simple fracture</option>
            <option value="cut">Cut that may need stitches</option>
            <option value="minor_burn">Minor burn</option>
            <option value="back_strain">Back or muscle strain</option>
            <option value="other">Something else</option>
          </select>
        </label>
        <label>Age in years
          <input id="age" type="number" min="0" max="120" step="1" required>
        </label>
        <div id="checklist"></div>
        <button id="find-care" type="submit">Find care</button>
        <p id="form-error" class="error" role="alert"></p>
      </form>

      <div id="result" aria-live="polite"></div>

      <details class="dev">
        <summary>Gemini connection check (temporary)</summary>
        <button id="test-gemini" type="button">Test Gemini</button>
        <pre id="gemini-reply" aria-live="polite"></pre>
      </details>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="sim.js"></script>
  <script src="router.js"></script>
  <script src="app.js"></script>
</body>
</html>
